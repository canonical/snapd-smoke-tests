execute: |
    snap run docker --help | MATCH 'A self-sufficient runtime for containers'
prepare: |
    snap install --channel=latest/"$X_SPREAD_DOCKER_RISK_LEVEL" docker
restore: |
    snap remove --purge docker
summary: Install and see Docker help output.
