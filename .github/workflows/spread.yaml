name: smoke
on:
    push:
        branches: ["main"]
    pull_request:
        paths:
            - ".github/workflows/spread.yaml"
            - "bin/*"
            - "spread.yaml"
            - "spread/*.sh"
            - "tests/**"
    workflow_dispatch:
        inputs:
            snapd-risk-level:
                description: "Store risk level of the snapd snap"
                type: choice
                default: beta
                required: true
                options:
                    - stable
                    - candidate
                    - beta
                    - edge
            lxd-risk-level:
                description: "Store risk level of the LXD snap"
                type: choice
                default: candidate
                required: true
                options:
                    - stable
                    - candidate
                    - beta
                    - edge
            maas-risk-level:
                description: "Store risk level of the MAAS snap"
                type: choice
                default: candidate
                required: true
                options:
                    - stable
                    - candidate
                    - beta
                    - edge
            snapcraft-risk-level:
                description: "Store risk level of the snapcraft snap"
                type: choice
                default: stable
                required: true
                options:
                    - stable
                    - candidate
                    - beta
                    - edge
            docker-risk-level:
                description: "Store risk level of the docker snap"
                type: choice
                default: stable
                required: true
                options:
                    - stable
                    - candidate
                    - beta
                    - edge
            image-garden-channel:
                description: "Store channel of the image-garden snap"
                type: string
                default: "latest/edge"
                required: true

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
    canary:
        runs-on: self-hosted-linux-amd64-noble-large
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              # This is essential for git restore-mtime to work correctly.
              with:
                fetch-depth: 0
            - name: Set environment variables for spread
              run: |
                # Export variables that spread picks up from the host.
                echo X_SPREAD_SNAPD_RISK_LEVEL="${{ inputs.snapd-risk-level || 'beta' }}" >> $GITHUB_ENV
                echo X_SPREAD_LXD_RISK_LEVEL="${{ inputs.lxd-risk-level || 'candidate' }}" >> $GITHUB_ENV
                echo X_SPREAD_MAAS_RISK_LEVEL="${{ inputs.maas-risk-level || 'candidate' }}" >> $GITHUB_ENV
                echo X_SPREAD_SNAPCRAFT_RISK_LEVEL="${{ inputs.snapcraft-risk-level || 'stable' }}" >> $GITHUB_ENV
                echo X_SPREAD_DOCKER_RISK_LEVEL="${{ inputs.docker-risk-level || 'stable' }}" >> $GITHUB_ENV
            - name: Run integration tests
              uses: zyga/image-garden-action@2891c7a26560054eaafa5084f7d43203652840f6
              with:
                # pkgproxy from latest/edge takes the egress proxy as its
                # own http-proxy and https-proxy options, which the action
                # sets from snapd's proxy settings and aproxy.
                pkgproxy-channel: latest/edge
                snapd-channel: latest/edge
                garden-system: ubuntu-cloud-24.04
                image-garden-channel: ${{ inputs.image-garden-channel || 'latest/edge' }}
                spread-artifacts: artifacts
                spread-artifacts-suffix: ubuntu-cloud-24.04
                # The canary saves the packages that the whole matrix shares,
                # on pushes to main only: runs started by hand may test other
                # risk levels, and only read the caches.
                cache-scope: shared
                save-cache: ${{ github.event_name == 'push' && 'default-branch' || 'never' }}
            - name: Show image-garden serial logs
              if: failure()
              run: |
                grep -n '' .image-garden/*.serial.log || true

    test:
        runs-on: self-hosted-linux-amd64-noble-large
        needs: canary
        strategy:
            fail-fast: false
            matrix:
                garden-system:
                    - almalinux-cloud-8
                    - amazonlinux-cloud-2
                    - amazonlinux-cloud-2023
                    - archlinux-cloud
                    - centos-cloud-10
                    - centos-cloud-9
                    - debian-cloud-12
                    - debian-cloud-13
                    - debian-cloud-sid
                    - fedora-cloud-42
                    - fedora-cloud-43
                    - opensuse-cloud-tumbleweed-at-apparmor
                    - opensuse-cloud-tumbleweed-at-selinux
                    - oracle-cloud-8
                    - rocky-cloud-8
                    - ubuntu-cloud-20.04
                    - ubuntu-cloud-22.04
                    # This is duplicating the canary job.
                    # - ubuntu-cloud-24.04
                    - ubuntu-cloud-25.10
                    - ubuntu-cloud-26.10
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              # This is essential for git restore-mtime to work correctly.
              with:
                fetch-depth: 0
            - name: Set environment variables for spread
              run: |
                # Export variables that spread picks up from the host.
                echo X_SPREAD_SNAPD_RISK_LEVEL="${{ inputs.snapd-risk-level || 'beta' }}" >> $GITHUB_ENV
                echo X_SPREAD_LXD_RISK_LEVEL="${{ inputs.lxd-risk-level || 'candidate' }}" >> $GITHUB_ENV
                echo X_SPREAD_MAAS_RISK_LEVEL="${{ inputs.maas-risk-level || 'candidate' }}" >> $GITHUB_ENV
                echo X_SPREAD_SNAPCRAFT_RISK_LEVEL="${{ inputs.snapcraft-risk-level || 'stable' }}" >> $GITHUB_ENV
                echo X_SPREAD_DOCKER_RISK_LEVEL="${{ inputs.docker-risk-level || 'stable' }}" >> $GITHUB_ENV
            - name: Run integration tests
              uses: zyga/image-garden-action@2891c7a26560054eaafa5084f7d43203652840f6
              with:
                # pkgproxy from latest/edge takes the egress proxy as its
                # own http-proxy and https-proxy options, which the action
                # sets from snapd's proxy settings and aproxy.
                pkgproxy-channel: latest/edge
                snapd-channel: latest/edge
                image-garden-channel: ${{ inputs.image-garden-channel || 'latest/edge' }}
                garden-system: ${{ matrix.garden-system }}
                spread-artifacts: artifacts
                spread-artifacts-suffix: ${{ matrix.garden-system }}
                # Share the packages of the canary, which saves them, and
                # keep the pristine image of this system, saved on pushes to
                # main only.
                cache-scope: shared
                save-package-cache: "false"
                save-cache: ${{ github.event_name == 'push' && 'default-branch' || 'never' }}
                spread-variant: plus
            - name: Show image-garden serial logs
              if: failure()
              run: |
                grep -n '' .image-garden/*.serial.log || true
