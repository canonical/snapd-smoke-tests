environment:
    LXD_TRACK/lxd_5: "5.0"
    LXD_TRACK/lxd_5_21: "5.21"
    LXD_TRACK/lxd_6: 6
    LXD_TRACK/lxd_latest: latest
    # the default track may be different than all of the above
    LXD_TRACK/lxd_default:
skip:
  - if: |
      [ -n "$LXD_TRACK" ] && [[ "$SPREAD_SYSTEM" != *ubuntu* ]]
    reason: decreasing test load on selected systems
  - if: |
      [ "$SPREAD_SYSTEM" = ubuntu-cloud-20.04 ] && [ "$LXD_TRACK" != 5.0 ] && [ "$LXD_TRACK" != 5.21 ]
    reason: LXD 6 cannot unpack images on the 5.4 kernel of Ubuntu 20.04 ("Function not implemented")
execute: |
    snap run lxd --help | MATCH 'The LXD container manager'
    snap run lxd.lxc launch "$(cat lxd-image-remote)":24.04 u1
    snap run lxd.lxc exec u1 -- cat /etc/os-release | MATCH 'VERSION_ID="24.04"'
prepare: |
    if [ -n "$LXD_TRACK" ]; then
        snap install --channel=${LXD_TRACK}/"${X_SPREAD_LXD_RISK_LEVEL}" lxd
    else
        snap install lxd
    fi
    # LXD is not immediately ready to accept API requests.
    snap run lxd waitready
    # Initialize LXD storage and networking with default settings.
    snap run lxd init --auto
    # Download container images through pkgproxy, which caches them, when
    # there is one. Only its image remotes are set up: its "lxd" setup would
    # point the containers at the bridge of this system, where pkgproxy does
    # not run, as it runs on the host of this virtual machine.
    # Spread runs this as root, without sudo, as the lxd-remote setup wants:
    # it changes the lxc configuration of the user who runs it. Exit status 1
    # means there is no pkgproxy; anything else is an error.
    if pkgproxy-setup lxd-remote; then
        snap run lxd.lxc remote list | MATCH pkgproxy-ubuntu
        echo pkgproxy-ubuntu >lxd-image-remote
    else
        [ $? -eq 1 ]
        echo ubuntu >lxd-image-remote
    fi
    # Allow LXD to connect to the network on systems where Docker is also installed.
    if [ -n "$(command -v docker)" ]; then
        if command -v iptables; then
            iptables -I DOCKER-USER -i lxdbr0 -j ACCEPT || true
            iptables -I DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT || true
        fi
        if command -v ip6tables; then
            ip6tables -I DOCKER-USER -i lxdbr0 -j ACCEPT || true
            ip6tables -I DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT || true
        fi
    fi
restore: |
    snap run lxd.lxc stop u1 || true
    snap run lxd.lxc delete u1 || true
    rm -rfv $HOME/snap/lxd
    rm -f lxd-image-remote
    snap remove --purge lxd
summary: Install and see LXD help output.
